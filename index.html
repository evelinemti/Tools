<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 5th Floor – Social Media Tool</title>
<style>
  :root {
    --teal:#2E7D82; --teal-mid:#3D8E94; --teal-light:#B8D4D6;
    --black:#1A1A1A; --grey:#E8E8E8; --white:#FFFFFF; --bg:#f4f4f4;
    --font:'Aptos','Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font);background:var(--bg);color:var(--black);font-size:15px;min-height:100vh;}

  /* TOPBAR */
  .topbar{background:var(--black);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;position:sticky;top:0;z-index:50;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .topbar-sub{font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:1.5px;text-transform:uppercase;}
  .topbar-slogan{font-size:11px;color:rgba(255,255,255,0.22);letter-spacing:1px;}

  /* MAIN TABS */
  .main-tabs{background:var(--white);border-bottom:2px solid var(--grey);display:flex;padding:0 24px;}
  .main-tab{padding:13px 22px;font-size:13px;font-weight:600;cursor:pointer;border:none;border-bottom:3px solid transparent;background:none;color:#888;font-family:var(--font);transition:all .15s;margin-bottom:-2px;}
  .main-tab:hover{color:var(--black);}
  .main-tab.active{color:var(--teal);border-bottom-color:var(--teal);}

  /* CHANNEL TABS (inside calendar) */
  .channel-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .channel-tabs{display:flex;gap:6px;}
  .ch-tab{padding:7px 18px;font-size:12px;font-weight:600;cursor:pointer;border-radius:100px;border:1.5px solid #ddd;background:var(--white);color:#888;font-family:var(--font);transition:all .15s;}
  .ch-tab:hover{border-color:var(--teal);color:var(--teal);}
  .ch-tab.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  .ch-tab.active.li{background:var(--black);border-color:var(--black);}
  .ch-tab.active.ig{background:#C13584;border-color:#C13584;}
  .ch-tab.active.nl{background:var(--teal-mid);border-color:var(--teal-mid);}

  /* MONTH NAV */
  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-label{font-size:15px;font-weight:600;min-width:140px;text-align:center;}
  .btn-nav{padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border-radius:8px;border:1px solid #ddd;background:var(--white);color:var(--black);font-family:var(--font);transition:background .12s;}
  .btn-nav:hover{background:var(--bg);}

  /* MONTH GRID */
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .dow-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--teal);text-align:center;padding:6px 0;border-bottom:2px solid var(--teal-light);margin-bottom:4px;}
  .day-cell{min-height:90px;background:var(--white);border-radius:10px;border:1px solid #eee;padding:8px;cursor:pointer;transition:box-shadow .12s;position:relative;}
  .day-cell:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
  .day-cell.today{border-color:var(--teal);border-width:2px;}
  .day-cell.other-month{background:#fafafa;opacity:.5;}
  .day-cell.empty{background:transparent;border:none;cursor:default;}
  .day-num{font-size:11px;font-weight:700;color:#aaa;margin-bottom:5px;}
  .day-cell.today .day-num{color:var(--teal);}
  .post-chip{border-radius:5px;padding:3px 7px;font-size:10px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;}
  .post-chip.dragging{opacity:.4;cursor:grabbing;}
  .day-cell.drag-over{background:#e8f4f5;border-color:var(--teal);border-style:dashed;}
  .chip-li{background:#e8e8e8;color:var(--black);}
  .chip-ig{background:#fce4ec;color:#c2185b;}
  .chip-nl{background:#e8f4f5;color:var(--teal);}
  .chip-all{background:#f0f0f0;color:#555;}
  .more-chip{font-size:10px;color:#aaa;padding:2px 4px;}
  .add-day-btn{position:absolute;bottom:5px;right:6px;background:none;border:none;font-size:16px;color:#ccc;cursor:pointer;line-height:1;font-family:var(--font);}
  .add-day-btn:hover{color:var(--teal);}

  /* LAYOUT */
  .page{max-width:1200px;margin:0 auto;padding:24px;}
  .view{display:none;}
  .view.active{display:block;}

  /* GENERATOR */
  .card{background:var(--white);border-radius:14px;border:1px solid #eee;padding:22px;}
  .card-label{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--teal);margin-bottom:16px;}
  .gen-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;}
  .form-row{margin-bottom:14px;}
  .form-row label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:5px;}
  .form-row select,.form-row textarea,.form-row input[type=text]{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-family:var(--font);font-size:13px;color:var(--black);background:var(--white);outline:none;transition:border-color .15s;}
  .form-row select:focus,.form-row textarea:focus{border-color:var(--teal);}
  .form-row textarea{resize:vertical;min-height:75px;}
  .btn-generate{width:100%;padding:12px;background:var(--teal);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);letter-spacing:.5px;transition:opacity .15s;}
  .btn-generate:hover{opacity:.88;}
  .output-box{min-height:180px;background:var(--bg);border-radius:9px;padding:16px;font-size:14px;line-height:1.8;color:var(--black);white-space:pre-wrap;margin-bottom:10px;border:1px solid #eee;font-family:var(--font);}
  .char-count{font-size:11px;color:#999;margin-bottom:12px;}
  .hashtag-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:6px;}
  .hashtag-box{background:#e8f4f5;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--teal);line-height:1.8;margin-bottom:14px;}
  .template-note{background:#e8f4f5;border-radius:9px;padding:10px 14px;font-size:12px;color:#2a6a6e;margin-bottom:12px;border-left:3px solid var(--teal);line-height:1.6;}
  .action-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-sm{padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;border-radius:8px;font-family:var(--font);border:1px solid #ddd;background:var(--white);color:var(--black);transition:background .12s;display:flex;align-items:center;gap:5px;}
  .btn-sm:hover{background:var(--bg);}
  .btn-sm.primary{background:var(--teal);color:#fff;border-color:var(--teal);}
  .btn-sm.primary:hover{opacity:.88;}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;}
  .modal{background:var(--white);border-radius:14px;padding:26px;width:500px;max-width:95vw;max-height:88vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .modal-head h3{font-size:15px;font-weight:600;}
  .btn-close{background:none;border:none;font-size:22px;cursor:pointer;color:#888;line-height:1;padding:0;}
  .status-pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 9px;border-radius:100px;}
  .s-draft{background:#f0f0f0;color:#888;}
  .s-ready{background:#e8f4f5;color:var(--teal);}
  .s-published{background:#e9f7ef;color:#27ae60;}

  /* TOAST */
  #toast{position:fixed;bottom:24px;right:24px;background:var(--black);color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;font-family:var(--font);}
  #toast.show{opacity:1;}

  @media(max-width:750px){
    .gen-grid{grid-template-columns:1fr;}
    .month-grid{grid-template-columns:repeat(7,1fr);}
    .topbar-slogan{display:none;}
    .day-cell{min-height:60px;}
  }
</style>
</head>

<div id="tab-generator" class="view active">

        </div>

const CHAR_LIMITS={linkedin:1300,instagram:2200};
const NOTES={linkedin:"LinkedIn · B2B-Ton, direkt und substanziell. Felder in [Klammern] ersetzen.",instagram:"Instagram · Visuell, lebendiger Ton. Felder in [Klammern] ersetzen. Bild oder Reel nicht vergessen."};
const MONTH_NAMES=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const DOW=['Mo','Di','Mi','Do','Fr','Sa','So'];

/* ── STATE ── */
let calPosts=JSON.parse(localStorage.getItem('5f_posts')||'{}');
let activeChannel='all';
let calYear=new Date().getFullYear();
let calMonth=new Date().getMonth();
let baseText='';
let currentAddKey='';

/* ── GENERATOR ── */
function getSelections(){return{platform:document.getElementById('platform').value,pillar:document.getElementById('pillar').value,language:document.getElementById('language').value,tmplIdx:parseInt(document.getElementById('template').value)};}
function populateTemplates(){const{platform,pillar,language}=getSelections();const sel=document.getElementById('template');sel.innerHTML='';(TEMPLATES[platform]?.[language]?.[pillar]||[]).forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=t.label;sel.appendChild(o);});}
function updateOutput(){populateTemplates();const{platform,pillar,language,tmplIdx}=getSelections();const ts=TEMPLATES[platform]?.[language]?.[pillar]||[];const t=ts[tmplIdx]||ts[0];if(!t)return;baseText=t.text;document.getElementById('output').textContent=t.text;document.getElementById('hashtags').textContent=t.hashtags;document.getElementById('template-note').textContent=NOTES[platform]||'';document.getElementById('custom').value='';updateCharCount();}
function applyCustom(){const c=document.getElementById('custom').value.trim();document.getElementById('output').textContent=c?baseText+'\n\n'+c:baseText;updateCharCount();}
function resetCustom(){document.getElementById('custom').value='';document.getElementById('output').textContent=baseText;updateCharCount();}
function updateCharCount(){const t=document.getElementById('output').textContent;const l=CHAR_LIMITS[document.getElementById('platform').value];const el=document.getElementById('char-count');el.textContent=`${t.length} / ${l} Zeichen`;el.style.color=t.length>l?'#e67e22':'#999';}
function copyPost(){const t=document.getElementById('output').textContent;const h=document.getElementById('hashtags').textContent;navigator.clipboard.writeText(t+(h&&!h.startsWith('—')?'\n\n'+h:'')).then(()=>showToast('Post kopiert ✓'));}
function addToCalendar(){
  const text=document.getElementById('output').textContent;
  const{platform,pillar,language,tmplIdx}=getSelections();
  const plat={linkedin:'LinkedIn',instagram:'Instagram'}[platform];
  const ts=TEMPLATES[platform]?.[language]?.[pillar]||[];
  const t=ts[tmplIdx]||ts[0];
  const today=new Date().toISOString().split('T')[0];
  if(!calPosts[today])calPosts[today]=[];
  const defT={'LinkedIn':'08:30','Instagram':'11:00'};
  const postTime=defT[plat]||'09:00';
  calPosts[today].push({platform:plat,format:t?t.label:'Post',text:text.slice(0,80)+(text.length>80?'…':''),full:text,status:'draft',time:postTime});
  savePosts();showToast('In Redaktionsplan gespeichert');
}

/* ── CALENDAR ── */
function setChannel(ch,btn){
  activeChannel=ch;
  document.querySelectorAll('.ch-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderMonth();
}
function changeMonth(dir){calMonth+=dir;if(calMonth>11){calMonth=0;calYear++;}if(calMonth<0){calMonth=11;calYear--;}renderMonth();}
function goToday(){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();renderMonth();}

function renderMonth(){
  document.getElementById('month-label').textContent=`${MONTH_NAMES[calMonth]} ${calYear}`;
  // DOW labels
  const dlEl=document.getElementById('dow-labels');
  dlEl.innerHTML='';
  DOW.forEach(d=>{const el=document.createElement('div');el.className='dow-label';el.textContent=d;dlEl.appendChild(el);});
  // Grid
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const startOffset=firstDay===0?6:firstDay-1;
  const today=new Date();
  // prev month padding
  for(let i=0;i<startOffset;i++){const c=document.createElement('div');c.className='day-cell other-month';grid.appendChild(c);}
  // actual days
  for(let d=1;d<=daysInMonth;d++){
    const date=new Date(calYear,calMonth,d);
    const key=date.toISOString().split('T')[0];
    const isToday=date.getFullYear()===today.getFullYear()&&date.getMonth()===today.getMonth()&&date.getDate()===today.getDate();
    const cell=document.createElement('div');
    cell.className='day-cell'+(isToday?' today':'');
    cell.dataset.key=key;
    cell.ondragover=(e)=>{e.preventDefault();cell.classList.add('drag-over');};
    cell.ondragleave=()=>cell.classList.remove('drag-over');
    cell.ondrop=(e)=>{
      e.preventDefault();
      cell.classList.remove('drag-over');
      const srcKey=e.dataTransfer.getData('srcKey');
      const srcIdx=parseInt(e.dataTransfer.getData('srcIdx'));
      const destKey=key;
      if(srcKey===destKey)return;
      if(!calPosts[srcKey])return;
      const post=calPosts[srcKey].splice(srcIdx,1)[0];
      if(!calPosts[destKey])calPosts[destKey]=[];
      calPosts[destKey].push(post);
      savePosts();renderMonth();showToast('Post verschoben');
    };
    const dayNum=document.createElement('div');
    dayNum.className='day-num';dayNum.textContent=d;cell.appendChild(dayNum);
    // posts
    const posts=calPosts[key]||[];
    const filtered=activeChannel==='all'?posts:posts.filter(p=>p.platform===activeChannel);
    const max=3;
    filtered.slice(0,max).forEach(p=>{
      const chip=document.createElement('div');
      const cls=p.platform==='LinkedIn'?'chip-li':p.platform==='Instagram'?'chip-ig':'chip-all';
      chip.className=`post-chip ${cls}`;
      chip.textContent=(p.time?p.time+' · ':'')+( p.format||p.platform);
      chip.title=p.text;
      chip.draggable=true;
      chip.dataset.srcKey=key;
      chip.dataset.srcIdx=posts.indexOf(p);
      chip.onclick=(e)=>{e.stopPropagation();openSlotModal(p,key,posts.indexOf(p));};
      chip.ondragstart=(e)=>{
        e.dataTransfer.setData('srcKey',key);
        e.dataTransfer.setData('srcIdx',String(posts.indexOf(p)));
        chip.classList.add('dragging');
      };
      chip.ondragend=()=>chip.classList.remove('dragging');
      cell.appendChild(chip);
    });
    if(filtered.length>max){const m=document.createElement('div');m.className='more-chip';m.textContent=`+${filtered.length-max} weitere`;cell.appendChild(m);}
    // add button
    const addBtn=document.createElement('button');
    addBtn.className='add-day-btn';addBtn.textContent='+';addBtn.title='Post hinzufügen';
    addBtn.onclick=(e)=>{e.stopPropagation();openAddPostModal(key,d);};
    cell.appendChild(addBtn);
    grid.appendChild(cell);
  }
  // trailing empty cells
  const total=startOffset+daysInMonth;
  const remainder=total%7;
  if(remainder!==0){for(let i=0;i<7-remainder;i++){const c=document.createElement('div');c.className='day-cell other-month';grid.appendChild(c);}}
}

/* ── MODALS ── */
function openSlotModal(post,key,idx){
  const sc=post.status==='published'?'s-published':post.status==='ready'?'s-ready':'s-draft';
  const sl=post.status==='published'?'Publiziert':post.status==='ready'?'Bereit':'Entwurf';
  const text=post.full||post.text;
  document.getElementById('slot-title').textContent=`${post.platform} · ${post.format}${post.time?' · '+post.time:''}`;
  document.getElementById('slot-body').innerHTML=`
    <div style="margin-bottom:12px"><span class="status-pill ${sc}">${sl}</span></div>
    <div style="background:var(--bg);border-radius:9px;padding:14px;font-size:13px;line-height:1.75;white-space:pre-wrap;margin-bottom:14px;border:1px solid #eee">${text}</div>
    <div style="margin-bottom:14px">
      <label style="font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:5px">Uhrzeit</label>
      <input type="time" id="slot-time" value="${post.time||''}" style="padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-family:var(--font);font-size:13px;width:100%">
    </div>
    <div style="margin-bottom:14px">
      <label style="font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:5px">Status</label>
      <select id="slot-status" style="padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-family:var(--font);font-size:13px">
        <option value="draft" ${post.status==='draft'?'selected':''}>Entwurf</option>
        <option value="ready" ${post.status==='ready'?'selected':''}>Bereit</option>
        <option value="published" ${post.status==='published'?'selected':''}>Publiziert</option>
      </select>
    </div>
    <div class="action-row">
      <button class="btn-sm primary" onclick="navigator.clipboard.writeText(${JSON.stringify(text)}).then(()=>showToast('Kopiert ✓'))">⎘ Kopieren</button>
      <button class="btn-sm" onclick="updatePostStatus('${key}',${idx},document.getElementById('slot-status').value)">Speichern</button>
      <button class="btn-sm" style="color:#c0392b;border-color:#c0392b" onclick="deletePost('${key}',${idx})">Löschen</button>
      <button class="btn-sm" onclick="closeSlotModal()">Schliessen</button>
    </div>`;
  document.getElementById('slot-modal').style.display='flex';
}
function closeSlotModal(){document.getElementById('slot-modal').style.display='none';}
function openAddPostModal(key,dayNum){
  currentAddKey=key;
  document.getElementById('add-modal-title').textContent=`Post hinzufügen – ${dayNum}. ${MONTH_NAMES[calMonth]}`;
  document.getElementById('add-body').innerHTML=`
    <div class="form-row"><label>Plattform</label>
      <select id="ap-p"><option>LinkedIn</option><option>Instagram</option></select></div>
    <div class="form-row"><label>Format / Typ</label>
      <input type="text" id="ap-f" placeholder="z.B. Reel, Member Spotlight, Event…"></div>
    <div class="form-row"><label>Text / Notiz</label>
      <textarea id="ap-t" style="min-height:80px" placeholder="Inhalt oder Stichwörter…"></textarea></div>
    <div class="form-row"><label>Uhrzeit <span style="font-weight:400;color:#aaa" id="ap-time-hint"></span></label>
      <input type="time" id="ap-time" value="09:00" style="padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-family:var(--font);font-size:13px;width:100%"></div>
    <div class="form-row"><label>Status</label>
      <select id="ap-s"><option value="draft">Entwurf</option><option value="ready">Bereit</option><option value="published">Publiziert</option></select></div>
    <div class="action-row" style="margin-top:10px">
      <button class="btn-sm primary" onclick="saveNewPost()" style="flex:1;justify-content:center">Hinzufügen</button>
      <button class="btn-sm" onclick="closeAddModal()">Abbrechen</button>
    </div>`;
  // Set smart default time based on platform
  const defTimes={'LinkedIn':'08:30','Instagram':'11:00'};
  const apPlatEl=document.getElementById('ap-p');
  const apTimeEl=document.getElementById('ap-time');
  const apHintEl=document.getElementById('ap-time-hint');
  if(apPlatEl&&apTimeEl){
    apPlatEl.onchange=function(){
      const t=defTimes[this.value]||'09:00';
      apTimeEl.value=t;
      if(apHintEl)apHintEl.textContent='(Empfehlung: '+t+')';
    };
    const initT=defTimes[apPlatEl.value]||'09:00';
    apTimeEl.value=initT;
    if(apHintEl)apHintEl.textContent='(Empfehlung: '+initT+')';
  }
  document.getElementById('add-modal').style.display='flex';
}
function closeAddModal(){document.getElementById('add-modal').style.display='none';}
function saveNewPost(){
  const p={platform:document.getElementById('ap-p').value,format:document.getElementById('ap-f').value||'Post',text:document.getElementById('ap-t').value||'(kein Text)',status:document.getElementById('ap-s').value,time:document.getElementById('ap-time').value||''};
  if(!calPosts[currentAddKey])calPosts[currentAddKey]=[];
  calPosts[currentAddKey].push(p);savePosts();closeAddModal();renderMonth();showToast('Post hinzugefügt');
}
function deletePost(key,idx){if(calPosts[key]){calPosts[key].splice(idx,1);savePosts();closeSlotModal();renderMonth();showToast('Post gelöscht');}}
function updatePostStatus(key,idx,status){if(calPosts[key]?.[idx]){calPosts[key][idx].status=status;const t=document.getElementById('slot-time');if(t)calPosts[key][idx].time=t.value;savePosts();closeSlotModal();renderMonth();showToast('Gespeichert');}}

/* ── TABS ── */
function switchMain(name,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='calendar')renderMonth();
}

/* ── UTILS ── */
function savePosts(){localStorage.setItem('5f_posts',JSON.stringify(calPosts));}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

/* ── INIT ── */
updateOutput();
</script>
